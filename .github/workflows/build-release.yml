name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.release_version.outputs.tag }}
      release_sha: ${{ steps.release_version.outputs.sha }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether this version needs a release
        id: release_version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content -Path 'VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "VERSION must contain a semantic version such as 1.0.1; found '$version'."
          }
          $tag = "v$version"
          $existingTag = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not query repository tags.' }
          if ($existingTag) {
            Write-Host "Release $tag already exists; this run will build only."
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'tag='
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'sha='
            exit 0
          }

          $headingPattern = '^## \[' + [regex]::Escape($tag) + '\](?:\s|$)'
          $changelog = Get-Content -Path 'CHANGELOG.md'
          if (-not ($changelog | Where-Object { $_ -match $headingPattern })) {
            throw "CHANGELOG.md must contain a section titled '## [$tag]' before publishing this version."
          }

          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine the source commit.' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$commit"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AlienCommandCenter.csproj

      - name: Build
        run: dotnet build AlienCommandCenter.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64 app
        run: dotnet publish AlienCommandCenter.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output publish

      - name: Package app and documentation
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'AlienBacklightColors'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          Copy-Item -Path 'publish\*' -Destination $bundle -Recurse -Force
          Copy-Item -Path 'README.md', 'CHANGELOG.md', 'THIRD_PARTY_NOTICES.md', 'VERSION' -Destination $bundle -Force
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath 'dist\AlienBacklightColors-win-x64.zip' -Force

      - name: Extract changelog section for this version
        id: changelog
        if: steps.release_version.outputs.tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $headingPattern = '^## \[' + [regex]::Escape($tag) + '\](?:\s|$)'
          $lines = Get-Content -Path 'CHANGELOG.md'
          $start = -1
          for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match $headingPattern) {
              $start = $index
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md must contain a section titled '## [$tag]' before publishing this version."
          }
          $notes = [System.Collections.Generic.List[string]]::new()
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^## \[') { break }
            $notes.Add($lines[$index])
          }
          $releaseNotes = ($notes -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw "The CHANGELOG.md section for '$tag' is empty."
          }
          Set-Content -Path 'dist\release-notes.md' -Value $releaseNotes -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlienBacklightColors-win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged app and release notes
        uses: actions/download-artifact@v4
        with:
          name: AlienBacklightColors-win-x64
          path: release-assets

      - name: Publish release and create version tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ needs.build.outputs.release_sha }}
          name: Alien Backlight Colors ${{ needs.build.outputs.release_tag }}
          body_path: release-assets/release-notes.md
          files: release-assets/AlienBacklightColors-win-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
